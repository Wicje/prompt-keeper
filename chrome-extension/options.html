<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Keeper — Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #fafafa;
        color: #111;
        padding: 32px;
      }
      .card {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 10px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        font: inherit;
        font-size: 13px;
      }
      button {
        margin-top: 18px;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: #18181b;
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .hint {
        font-size: 12px;
        color: #52525b;
        margin-top: 6px;
        line-height: 1.5;
      }
      #savedStatus {
        margin-left: 12px;
        font-size: 13px;
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Prompt Keeper settings</h1>
      <label for="baseUrl">App URL</label>
      <input id="baseUrl" placeholder="https://prompt-keeper-teal.vercel.app" />
      <label for="apiKey">Capture key</label>
      <input id="apiKey" type="password" placeholder="pk_…" />
      <p class="hint">
        Get your capture key from your app at
        <em>Integrations → Generate my capture key</em>. It is stored only in
        this browser and sent over HTTPS to your app&apos;s
        /api/external/capture endpoint.
      </p>
      <button id="save">Save</button><span id="savedStatus"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
